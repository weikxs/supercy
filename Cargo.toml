[workspace]
resolver = "3"
members = ["crates/*"]
# Fuzzing needs a nightly toolchain and has its own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
cy-model = { path = "crates/cy-model" }
cy-filter = { path = "crates/cy-filter" }
cy-search = { path = "crates/cy-search" }
cy-platform = { path = "crates/cy-platform" }
cy-store = { path = "crates/cy-store" }
cy-engine = { path = "crates/cy-engine" }
cy-ffi = { path = "crates/cy-ffi" }
blake3 = "1.8"
chacha20poly1305 = "0.10"
ciborium = "0.2"
getrandom = "0.3"
regex = "1"
pinyin = { version = "0.10", default-features = false, features = ["plain", "heteronym"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = "1.8"
proptest = "1"
tempfile = "3"
uniffi = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
