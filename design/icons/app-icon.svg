<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Supercy app icon. macOS (Big Sur and later) grid: 1024 canvas, 824 rounded square at 100,
       corner radius 185, room for the shadow. Concept A: clipboard whose board carries an "S". -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#3A3ED0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E9FF"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A68F5"/>
      <stop offset="1" stop-color="#3337C2"/>
    </linearGradient>
    <filter id="canvasShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.28"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="14" result="blur"/>
      <feFlood flood-color="#14185E" flood-opacity="0.38"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#canvas)" filter="url(#canvasShadow)"/>
  <g filter="url(#boardShadow)">
    <rect x="292" y="252" width="440" height="560" rx="76" fill="url(#board)"/>
    <rect x="404" y="206" width="216" height="104" rx="46" fill="#1E2270"/>
  </g>
  <path d="M 600 410 C 575 372, 430 365, 430 450 C 430 535, 594 515, 594 600 C 594 690, 445 690, 420 640"
        fill="none" stroke="url(#mark)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
