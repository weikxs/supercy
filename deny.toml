# Dependency policy, checked by `make deny` (part of `make test`).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained (not a vulnerability): askama's template configuration parser, used at build time by
  # UniFFI's binding generator. Every UniFFI release up to 0.32 depends on it. Tracked in the plan.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi -> askama; no maintained alternative upstream yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. No GPL-family licenses, so the project's own license stays an open choice.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
]

# MPL-2.0 is file-level copyleft and stays compatible with any project license when the files are
# unmodified. Allow it only for UniFFI, which generates the Swift and Kotlin bindings.
exceptions = [
  { crate = "uniffi", allow = ["MPL-2.0"] },
  { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
  { crate = "uniffi_core", allow = ["MPL-2.0"] },
  { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_meta", allow = ["MPL-2.0"] },
  { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
  { crate = "uniffi_udl", allow = ["MPL-2.0"] },
]
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished and the project license is not chosen yet.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
