[package]
name = "cy-ffi"
description = "UniFFI bindings of the Supercy engine for the native shells (Swift first)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# staticlib: linked into the macOS app; cdylib: read by the binding generator; lib: Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
cy-engine.workspace = true
cy-model.workspace = true
cy-platform.workspace = true
cy-store.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The workspace lints, except `unsafe_code`: UniFFI's generated scaffolding is the one place
# where unsafe code is allowed (docs/development/standards.md, section 5). Hand-written unsafe
# code is still refused in review.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
